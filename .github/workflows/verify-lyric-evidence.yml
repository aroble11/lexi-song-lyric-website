name: Validate and publish site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified site to GitHub Pages (main only)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Test publishing safeguards
        shell: powershell
        run: ./tests/publishing.tests.ps1
      - name: Verify evidence and prepare only public site files
        shell: powershell
        run: ./prepare-site.ps1
      - name: Upload the verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
# Activate later by changing Settings > Pages > Source to GitHub Actions.
# Branch-based Pages remains independent until that setting is changed.
